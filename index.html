<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sherin Baby-Profile Card</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-teal-50">
    <div class=" min-h-screen flex justify-center items-center">
        <div class=" w-full max-w-xs bg-white text-center p-8 outline outline-gray-100 rounded-xl shadow-xl">
            
            <div>
            <h1 class="bg-blue-200 size-20 rounded-full  text-blue-600 text-4xl font-bold mx-auto flex justify-center items-center">SB</h1>
            </div>

          
            <h1 class="mt-4 text-xl font-semibold">Sherin Baby</h1>
            <h3 class="text-gray-700">Frontend developer</h3>
            <span class="text-gray-400 text-sm">Kochi,Kerala</span>
          
            <p class="text-gray-700 text-balance">I build clean, responsive websites and love learning new CSS tricks.</p>
             
        
            <hr class=" mt-5 text-gray-300  w-full">
           
            <div class=" mt-5 flex justify-center text-center items-center text-md font-semibold">
                <p>128 posts</p> 
                <p>2.4K followers</p> 
                <p>310 following</p> 

            </div>
          
            <hr class="mt-5 text-gray-300  w-full">
             
            <div class="flex mt-6 gap-3">
                <button class="bg-blue-500 text-white font-medium rounded-md  py-2 flex-1 transition hover:bg-blue-600 cursor-pointer">Follow</button>
                <button class="outline outline-gray-400 rounded-md  py-2 font-medium flex-1 transition hover:bg-gray-200 cursor-pointer">Message</button>
            </div>
        </div>
    </div>
</body>
</html>
